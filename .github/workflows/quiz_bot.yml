name: Post daily Barca quiz

on:
  schedule:
    - cron: "0 15 * * *"   # once a day at 15:00 UTC (3pm Accra time)
  workflow_dispatch: {}     # lets you trigger it manually to test

permissions:
  contents: write

jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Post quiz
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python quiz_bot.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_state.json
          git diff --staged --quiet || git commit -m "Update quiz state"
          git push
