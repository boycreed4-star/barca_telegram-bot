name: Forward tweets to Telegram

on:
  schedule:
        - cron: "*/5 * * * *"    # every 5 minutes   # every 10 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit last_tweet_id.txt

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write cookies file from secret
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: echo "$COOKIES_JSON" > cookies.json

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python check_tweets.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_tweet_id_*.txt recent_posts.json
          git diff --staged --quiet || git commit -m "Update last posted tweet id"
          git push
